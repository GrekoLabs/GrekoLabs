services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grekolabs}
      POSTGRES_USER: ${POSTGRES_USER:-grekolabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-grekolabs} -d ${POSTGRES_DB:-grekolabs}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
